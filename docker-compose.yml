services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres-db:
    image: postgres:17-alpine
    container_name: wagateway-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-wagateway}
    ports:
      - "127.0.0.1:5489:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # $$ agar Docker Compose tidak menginterpolasi variable dari .env host
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-wagateway}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Hermes Agent ─────────────────────────────────────────────────────────
  # Diletakkan sebelum wa-gateway agar depends_on bisa mereferensikannya
  hermes-agent:
    image: nikolaik/python-nodejs:python3.12-nodejs22
    container_name: wagateway-hermes
    ports:
      - "127.0.0.1:8689:8689"
    environment:
      API_SERVER_KEY: ${HERMES_API_KEY}
      GATEWAY_ALLOW_ALL_USERS: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      API_SERVER_HOST: "0.0.0.0"
    volumes:
      - hermes_sessions:/root/.hermes/sessions # Global session tanpa profil spesifik
      - ./config.yaml:/app/config.yaml
    entrypoint: >
      bash -c "
        pip install --no-cache-dir hermes-agent &&
        mkdir -p /root/.hermes &&
        sed \"s/key: YOUR_HERMES_API_KEY/key: $${API_SERVER_KEY}/g\" /app/config.yaml > /root/.hermes/config.yaml &&
        hermes gateway run --replace
      "
    restart: unless-stopped

  # ── WA Gateway (Node.js + Chromium) ─────────────────────────────────────
  wa-gateway:
    image: ferdignatius/wa-gateway:latest
    container_name: wagateway-app
    # shm_size DIHAPUS: Chromium dikonfigurasi dengan --disable-dev-shm-usage
    # sehingga Chromium menggunakan /tmp (bukan /dev/shm) — shm_size tidak berpengaruh.
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB:-wagateway}?schema=public"
      HERMES_API_URL: ${HERMES_API_URL}
      HERMES_API_KEY: ${HERMES_API_KEY}
      HERMES_SECRET: ${HERMES_SECRET}
      EXPRESS_PORT: 4849
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      postgres-db:
        condition: service_healthy
      hermes-agent:
        condition: service_started # Hermes tidak punya healthcheck; minimal pastikan container jalan
    volumes:
      - wa_auth:/app/.wwebjs_auth
      - ./prisma.config.ts:/app/prisma.config.ts
      - wa_cache:/app/.wwebjs_cache
    restart: unless-stopped
    healthcheck:
      # Gunakan endpoint /health yang sudah ada di Express app
      test: [ "CMD-SHELL", "curl -sf http://localhost:4849/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s # Beri waktu Chromium + WA Client untuk warmup
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # ── Nginx Reverse Proxy ──────────────────────────────────────────
  # Entry point untuk frontend (port 80). Nginx proxy ke wa-gateway.
  nginx:
    image: nginx:alpine
    container_name: wagateway-nginx
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      wa-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
    name: wagateway-pgdata
  wa_auth:
    name: wagateway-wa-auth
  wa_cache:
    name: wagateway-wa-cache
  hermes_sessions:
    name: wagateway-hermes-sessions
