# docker-compose.yml — WA Gateway + Hermes Agent
services:
  # ── Hermes Agent AI ──────────────────────────────────────────────────────────
  # Menggunakan official image NousResearch. Port default: 8642.
  hermes-agent:
    image: nousresearch/hermes-agent
    container_name: wabot-hermes
    command: ["gateway", "run"]
    volumes:
      - hermes_sessions:/opt/data
    networks:
      - proxy-tier  # Akses internet (OpenRouter API) & komunikasi dengan wa-gateway
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── WA Gateway (Pure Gateway: Node.js + Chromium) ───────────────────────────
  wa-gateway:
    image: ferdignatius/wa-gateway:latest
    container_name: wabot-gateway
    restart: unless-stopped
    expose:
      - "4849"
    environment:
      NODE_ENV: production

      # ── Hermes Agent ──────────────────────────────────────────────────────────
      HERMES_API_URL: "http://wabot-hermes:8642/v1/responses"
      HERMES_API_KEY: ${HERMES_API_KEY}
      HERMES_SECRET: ${HERMES_SECRET}

      # ── App Config ────────────────────────────────────────────────────────────
      EXPRESS_PORT: 4849
      OWNER_NUMBER: ${OWNER_NUMBER}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      ALLOWED_GROUPS: ${ALLOWED_GROUPS:-}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

    depends_on:
      hermes-agent:
        condition: service_started
    volumes:
      - wa_auth:/app/.wwebjs_auth
      - wa_cache:/app/.wwebjs_cache
    networks:
      - proxy-tier  # Routing internal & NPM reverse-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4849/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wa_auth:
    name: wabot-wa-auth
  wa_cache:
    name: wabot-wa-cache
  hermes_sessions:
    name: hermes-data

networks:
  proxy-tier:
    external: true
